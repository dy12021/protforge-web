<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport 跟着设备宽度走。原先的 width=1280 是 SPEC 12「只保证桌面 1280px 以上」
     留下的：手机上整页按 1280 CSS px 渲染再整体缩小，字号实际缩到约 5px，等于没适配。
     现在窄屏交给 style.css 末尾那组断点：≥1180px 五列 / 760–1179px 平板三列 /
     <760px 手机单列纵向堆叠，每站的列头变成粘顶色带。
     **不设 user-scalable=no**——禁掉用户缩放，等于把低视力用户唯一的放大手段关掉。 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动化计算平台</title>
<!-- 空 data URI 当 favicon：省掉一次必然 404 的 /favicon.ico 请求 -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1>自动化计算平台</h1>
    <span class="toolbar-gap"></span>
    <span id="who" class="who"></span>
    <button id="market-btn" class="secondary" type="button">工具市场</button>
    <button id="new-btn" class="primary" type="button">＋ 提交计算任务</button>
    <button id="logout-btn" class="secondary" type="button">退出</button>
  </header>

  <!-- 筛选条：视图范围（全部 / 普通任务 / 工作流）+ 状态 + 关键字。
       工作流不再是另一个页面，所以「看哪一类」是**看板内的一个开关**，
       而不是一次跳转。 -->
  <div class="filters" id="filters">
    <div class="seg" id="view-switch" role="group" aria-label="视图范围">
      <button class="seg-btn is-on" data-view="all" type="button">全部</button>
      <button class="seg-btn" data-view="task" type="button">普通任务</button>
      <button class="seg-btn" data-view="workflow" type="button">工作流</button>
    </div>
    <input id="q" type="search" placeholder="搜索标题、需求、当前步骤或表格名" autocomplete="off" aria-label="搜索">
    <select id="status-filter" aria-label="状态筛选"><option value="">全部状态</option></select>
    <label class="toggle"><input id="only-active" type="checkbox"> 只看在跑的</label>
    <span class="toolbar-gap"></span>
    <span id="filter-note" class="who"></span>
  </div>

  <!-- 状态面板：平台整体的量。**默认只读**——它是给人看现状的，不是给人填的。
       指标是动态画的（#sp-metrics / #sp-system），所以正文里没有一堆空壳容器。 -->
  <section class="status-panel" id="status-panel" aria-label="平台状态">
    <div class="sp-head">
      <h2 class="sp-title">平台状态</h2>
      <span class="sp-note" id="sp-note"></span>
    </div>
    <div class="sp-metrics" id="sp-metrics"></div>
    <!-- 系统指标（CPU / 内存 / GPU / 磁盘）只对管理员渲染。
         普通用户**根本不发那个请求**——不是发完再藏起来。 -->
    <div class="sp-system" id="sp-system" hidden></div>
  </section>

  <!-- 只读提示条：服务没起来 / 登录过期这类全局问题落在这里，
       不能塞进抽屉或某个卡片里——抽屉关着的时候用户看不见。 -->
  <div id="board-msg" class="board-msg" hidden></div>

  <!-- 工作流区：工作流以**主卡片**的形式出现，展开后是行列表。
       以前它是另一个页面（workflow.html），现在与计算任务同处一块看板。 -->
  <section class="wf-zone" id="wf-zone" aria-label="工作流">
    <div class="zone-head">
      <h2 class="zone-title">工作流</h2>
      <span class="zone-sub" id="wf-zone-sub"></span>
    </div>
    <div class="wf-cards" id="wf-cards"></div>
    <p class="zone-empty" id="wf-empty" hidden>还没有工作流。</p>
  </section>

  <!-- 计算任务看板：五站主链 + 失败。 -->
  <main class="board" id="board"></main>

  <!-- 提交计算任务 / 新建工作流 / 修改工作流：**同一个对话框**。
       两种模式按字段切换，不是另开一个界面。
       <dialog> 原生自带 Esc 关闭与焦点约束。 -->
  <dialog class="composer" id="composer">
    <form class="composer-inner" id="composer-form" method="dialog">
      <h2 class="composer-title" id="c-title-h">提交计算任务</h2>
      <div class="seg seg-mode" id="mode-switch" role="group" aria-label="提交方式">
        <button class="seg-btn is-on" data-mode="task" type="button">单个任务</button>
        <button class="seg-btn" data-mode="workflow" type="button">工作流（表格 + 模板）</button>
      </div>
      <p class="composer-lead" id="c-lead">
        用一句话说清想算什么。提交后平台自己编排技能链，中间不用管，
        进度在看板上看得到。
      </p>

      <!-- 模式一：单个任务 -->
      <div id="c-task-fields">
        <label class="field">
          <span>任务标题</span>
          <input id="c-title" required maxlength="200" placeholder="例如：1ubq 折叠稳定性打分"
                 autocomplete="off">
        </label>
        <label class="field">
          <span>需求说明</span>
          <!-- 上限 20000 字符，与后端一致：超出后端返 422，前端先挡住，
               别让用户白等一次往返才发现写多了。 -->
          <textarea id="c-brief" required maxlength="20000" rows="7"
                    placeholder="要算什么、输入是什么、想要什么形式的产物。写得越具体，计算链越不用猜。"></textarea>
        </label>
      </div>

      <!-- 模式二：工作流。表格每行一个计算任务，逐行串行跑。 -->
      <div id="c-wf-fields" hidden>
        <div class="wf-upload-row">
          <label class="field">
            <span>表格文件（xlsx）</span>
            <input id="c-wf-file" type="file" accept=".xlsx">
          </label>
          <button id="c-wf-upload" class="secondary" type="button">上传表格</button>
        </div>
        <p class="who" id="c-wf-note"></p>
        <!-- 列的角色：上传之后才有表头可点。这里是动态画的，
             所以正文里只留一个容器。 -->
        <div class="wf-cols" id="c-wf-cols"></div>
        <label class="field">
          <span>提示词模板</span>
          <textarea id="c-wf-template" rows="4"
                    placeholder="列绑定的变量写成两个大括号包起来，例如：序列号是 {{seq}}。"></textarea>
        </label>
        <label class="toggle">
          <input id="c-wf-writeback" type="checkbox" checked>
          把结果写回 Excel（关掉后结果只存在平台里，不生成结果表）
        </label>
      </div>

      <div class="composer-actions">
        <button class="secondary" type="button" id="c-cancel">算了</button>
        <button class="primary" type="submit" id="c-save">提交</button>
      </div>
    </form>
  </dialog>

  <!-- 共享 / 转让。**默认只读**：打开先看见「现在有谁在用」，
       要加人就搜一个账户，要转让得点「转让」再走一步确认。
       不用 window.prompt：那种框既挑不了账户，也放不下「转让之后你会
       失去访问」这类后果说明——而没有后果说明的不可撤销动作是危险的。 -->
  <!-- 工具市场。**直接调工具**：选一个、按契约填参数、平台就跑它——
       不经 agent（确定性的活别交给不确定的环节：agent 可能自己写替代脚本，
       2026-10-24 那条跑了 4 小时 42 分的 O(n²) 碰撞消解就是这么来的）。 -->
  <dialog class="composer market" id="market">
    <div class="composer-inner">
      <h2 class="composer-title" id="mt-title">工具市场</h2>
      <p class="composer-lead">
        按契约填参数，平台直接调用那个入口脚本。<b>不经 agent</b>——
        跑出来的就是那个工具的结果，不会自己发明别的算法。
      </p>
      <div class="market-bar">
        <input id="mt-search" class="market-search" type="search"
               placeholder="搜工具名或分类">
        <span id="mt-cats" class="market-cats"></span>
      </div>
      <div class="market-grid" id="mt-grid"></div>
      <p class="zone-empty" id="mt-empty" hidden>没有匹配的工具。</p>
      <p class="market-msg" id="mt-msg" hidden></p>

      <div class="market-detail" id="mt-detail" hidden>
        <div class="market-detail-head">
          <h3 id="mt-d-title"></h3>
          <button class="secondary" type="button" id="mt-d-back">返回列表</button>
        </div>
        <p class="mt-d-meta" id="mt-d-meta"></p>

        <!-- 详细文档。**工具的说明书就是它的文档**（技能仓里那份 SKILL.md），
             平台不另写一份——写两份就会漂移。 -->
        <details class="mt-doc" id="mt-doc-box">
          <summary id="mt-doc-sum">详细文档</summary>
          <pre class="mt-doc-body" id="mt-doc">（打开工具时自动取）</pre>
        </details>

        <!-- agent 辅助填参数：**执行仍然由脚本做**，agent 只负责把
             「我要算什么」翻译成契约参数。填歪的会被契约校验挡住。 -->
        <div class="mt-fill">
          <label class="field">
            <span class="field-k">用一句话说你要算什么，agent 帮你填参数</span>
            <textarea id="mt-req" class="market-textarea" rows="2"
                      placeholder="例如：给 1ubq.pdb 的 A 链设计 8 条序列，采样温度 0.2"></textarea>
          </label>
          <div class="mt-fill-row">
            <button class="secondary" type="button" id="mt-fill">让 agent 填</button>
            <span class="market-msg" id="mt-fill-msg" hidden></span>
          </div>
        </div>

        <div class="mt-params" id="mt-params"></div>
        <label class="toggle mt-batch">
          <input type="checkbox" id="mt-batch"> 批量（每行一个输入，共享下面的参数）
        </label>
        <textarea id="mt-batch-list" class="market-textarea" rows="3"
                  placeholder="每行一个输入（例如每个 pdb 路径）" hidden></textarea>
        <div class="composer-actions">
          <button class="secondary" type="button" id="mt-cancel">算了</button>
          <button class="primary" type="button" id="mt-run">运行</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="share" id="share">
    <div class="share-inner">
      <h2 class="share-title" id="sh-title">共享工作流</h2>
      <p class="share-lead" id="sh-lead"></p>
      <div class="share-body" id="sh-body"></div>
      <div class="composer-actions">
        <button class="secondary" type="button" id="sh-cancel">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 打回 / 续跑。**要一句话的输入**，所以另开一张表而不是套那张两步确认表
     （确认表里没有输入框，塞进去就变成「确认之前先在静态文案里打字」）。
     「续跑」是同一个任务接着干：上一轮的产物留在工作目录里，模型接着改。 -->
  <dialog class="review" id="review">
    <div class="review-inner">
      <h2 class="review-title" id="rv-title">补充要求</h2>
      <p class="review-lead" id="rv-lead"></p>
      <label class="field">
        <span id="rv-note-k">补充要求</span>
        <textarea id="rv-note" rows="5"
                  placeholder="例如：换个对接种子再跑；把 RMSD 的判定标准写清楚再交。"></textarea>
      </label>
      <div class="composer-actions">
        <button class="secondary" type="button" id="rv-cancel">算了</button>
        <button class="primary" type="button" id="rv-ok">续跑</button>
      </div>
    </div>
  </dialog>

  <!-- 登录。token 存 localStorage 并走 Authorization 头（不放 Cookie，
       浏览器不会自动附加自定义头，天然免 CSRF）。 -->
  <dialog class="login" id="login">
    <form class="login-inner" id="login-form" method="dialog">
      <h2 class="login-title">自动化计算平台</h2>
      <p class="login-lead">用公司发的账号登录。</p>
      <label class="field">
        <span>账号</span>
        <input id="l-user" required autocomplete="username">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="l-pass" required type="password" autocomplete="current-password">
      </label>
      <p class="login-error" id="login-error" hidden></p>
      <div class="composer-actions">
        <button class="primary" type="submit" id="login-btn">登录</button>
      </div>
    </form>
  </dialog>

  <!-- 两步确认。中止计算任务、以及删除计算任务都走这张表。
       <dialog> 是复用节点，所以 app.js 里的收尾必须幂等并解绑监听。 -->
  <dialog class="confirm" id="confirm">
    <div class="confirm-inner">
      <h2 class="confirm-title" id="confirm-title"></h2>
      <p class="confirm-lead" id="confirm-lead"></p>
      <ul class="confirm-list" id="confirm-list"></ul>
      <div class="confirm-actions">
        <button class="secondary" type="button" id="confirm-cancel">算了</button>
        <button class="danger" type="button" id="confirm-ok">确认</button>
      </div>
    </div>
  </dialog>

  <!-- 抽屉：点卡片开。**默认只读**——详情是给人读的，不是给人填的。
       每个区块标题右侧有小字「编辑」才进编辑态，存完回只读。 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-inner">
      <div class="drawer-bar">
        <button class="drawer-icon" id="drawer-full" type="button"
                aria-label="展开到全屏" title="展开到全屏">⤢</button>
        <button class="drawer-icon" id="drawer-close" type="button"
                aria-label="关闭" title="关闭（Esc）">✕</button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
